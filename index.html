<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Where Is My Bus Odisha</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f7f6;
}

header{
background:#087f3e;
color:white;
padding:25px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
font-size:17px;
}

.container{
padding:20px;
max-width:650px;
margin:auto;
}

input,select,button{
width:100%;
padding:15px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
font-size:16px;
}

button{
background:#087f3e;
color:white;
border:0;
font-weight:bold;
cursor:pointer;
}

.bus{
background:white;
padding:20px;
margin-top:18px;
border-radius:15px;
box-shadow:0 2px 10px #ccc;
}

.bus h2{
margin-top:0;
}

.live{
color:green;
font-weight:bold;
font-size:18px;
}

#status{
margin-top:18px;
padding:10px;
font-weight:bold;
}

#map{
width:100%;
height:400px;
margin-top:20px;
border-radius:15px;
overflow:hidden;
}

.noBus{
background:white;
padding:20px;
margin-top:18px;
border-radius:15px;
box-shadow:0 2px 10px #ccc;
font-size:18px;
}

</style>

</head>

<body>

<header>

<h1>🚍 Where Is My Bus Odisha</h1>

<p>
Government • Private • School • Staff Bus
</p>

</header>

<div class="container">

<h2>🔎 Search Bus</h2>

<input
id="busNumber"
placeholder="Bus Number: Example STAFF-001">

<input
id="from"
placeholder="From: Example Lanjigarh">

<input
id="to"
placeholder="To: Example Rayagada">

<select id="type">

<option value="All">All Bus</option>

<option value="Government">Government</option>

<option value="Private">Private</option>

<option value="School">School</option>

<option value="Staff">Staff</option>

</select>

<button onclick="searchBus()">
🔎 SEARCH BUS
</button>

<div id="results"></div>

<div id="status">
⏳ Connecting to Firebase...
</div>

<div id="map"></div>

</div>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

     






























<script>
const firebaseURL =
     
"https://where-is-my-buss-odisha-default-rtdb.firebaseio.com/.json";

const map = L.map("map").setView(
  [19.9167,83.4167],
  10
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
    "&copy; OpenStreetMap contributors"
  }
).addTo(map);

let allBuses = [];
let markers = [];

function getBusValue(bus, field, fallback=""){
  const wanted =
    field.trim().toLowerCase();

  const key =
    Object.keys(bus || {}).find(
      k =>
      String(k).trim().toLowerCase()
      === wanted
    );

  if(key !== undefined){
    return bus[key];
  }

  return fallback;
}

async function loadBuses(){

  try{

    document.getElementById("status").innerHTML =
      "⏳ Loading buses...";

    const response =
      await fetch(firebaseURL);

    if(!response.ok){
      throw new Error(
        "Database connection failed"
      );
    }

    const data =
      await response.json();

    allBuses = [];

    if(!data){

      document.getElementById("status").innerHTML =
        "❌ No bus data found";

      return;
    }

    Object.keys(data).forEach(
      (busId)=>{

        const bus =
          data[busId];

        if(
          bus &&
          typeof bus === "object"
        ){

          const busNumber =
            getBusValue(
              bus,
              "busNumber",
              busId
            );

          const from =
            getBusValue(
              bus,
              "From",
              ""
            );

          const to =
            getBusValue(
              bus,
              "to",
              ""
            );

          const type =
            getBusValue(
              bus,
              "Type",
              ""
            );

          if(
            busNumber ||
            from ||
            to ||
            type
          ){

            allBuses.push({
              ...bus,
              databaseId: busId
            });

          }

        }

      }
    );

    document.getElementById("status").innerHTML =
      "🔥 Firebase connected • " +
      allBuses.length +
      " bus ready";

    showBuses(allBuses);

  }
  catch(error){

    document.getElementById("status").innerHTML =
      "❌ Firebase error: " +
      error.message;

  }

}

loadBuses();























































































     














































































































     
     
     
/* =========================
   SHOW BUS
========================= */

function showBuses(buses){

const results =
document.getElementById("results");

results.innerHTML = "";


markers.forEach(
marker=>{
map.removeLayer(marker);
}
);

markers = [];


if(
buses.length === 0
){

results.innerHTML =
"<div class='noBus'>" +
"❌ No bus found. Try another search." +
"</div>";

return;

}


buses.forEach(
bus=>{

const busNumber =
getBusValue(
bus,
"busNumber",
bus.databaseId || "Unknown Bus"
);

const from =
getBusValue(
bus,
"From",
"-"
);

const to =
getBusValue(
bus,
"to",
"-"
);

const type =
getBusValue(
bus,
"Type",
"Unknown"
);

const latitude =
Number(
getBusValue(
bus,
"Latitude",
""
)
);

const longitude =
Number(
getBusValue(
bus,
"Longitude",
""
)
);


results.innerHTML += `

<div class="bus">

<h2>
🚍 ${busNumber}
</h2>

<p>
<b>Route:</b>
${from} → ${to}
</p>

<p>
<b>Type:</b>
${type}
</p>

<p class="live">
📍 LIVE LOCATION
</p>

<p>
<b>Latitude:</b>
${!isNaN(latitude) ? latitude : "-"}
</p>

<p>
<b>Longitude:</b>
${!isNaN(longitude) ? longitude : "-"}
</p>

</div>

`;


if(
!isNaN(latitude) &&
!isNaN(longitude)
){

const marker =
L.marker(
[latitude,longitude]
).addTo(map);

marker.bindPopup(

"🚍 <b>" +
busNumber +
"</b><br>" +
from +
" → " +
to +
"<br>Type: " +
type

);

markers.push(marker);

}

if(markers.length > 0){
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds(), {
        padding:[20,20]
    });
}

}


/* =========================
   SEARCH BUS
========================= */

window.searchBus =
function(){

const number =
document
.getElementById("busNumber")
.value
.toLowerCase()
.trim();

const from =
document
.getElementById("from")
.value
.toLowerCase()
.trim();

const to =
document
.getElementById("to")
.value
.toLowerCase()
.trim();

const type =
document
.getElementById("type")
.value;


const filtered =
allBuses.filter(
bus=>{

const busNumber =
String(
getBusValue(
bus,
"busNumber",
bus.databaseId || ""
)
)
.toLowerCase()
.trim();

const busFrom =
String(
getBusValue(
bus,
"From",
""
)
)
.toLowerCase()
.trim();

const busTo =
String(
getBusValue(
bus,
"to",
""
)
)
.toLowerCase()
.trim();

const busType =
String(
getBusValue(
bus,
"Type",
""
)
)
.trim();


const numberMatch =
!number ||
busNumber.includes(number);

const fromMatch =
!from ||
busFrom.includes(from);

const toMatch =
!to ||
busTo.includes(to);

const typeMatch =
type === "All" ||
busType.toLowerCase()
=== type.toLowerCase();


return (
numberMatch &&
fromMatch &&
toMatch &&
typeMatch
);

});


showBuses(filtered);


if(
filtered.length > 0
){

const bus =
filtered[0];

const lat =
Number(
getBusValue(
bus,
"Latitude",
""
)
);

const lng =
Number(
getBusValue(
bus,
"Longitude",
""
)
);

if(
!isNaN(lat) &&
!isNaN(lng)
){

map.setView(
[lat,lng],
13
);

}

}

};

} catch (error) {
  document.getElementById("status").innerHTML =
    "❌ Main Firebase error: " + error.message;
}
 startFirebase();  
</script>
  
   


</body>
</html>
