<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where Is My Bus Odisha</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f7;
}

.header {
  background: #087f5b;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 6px 0 0;
  font-size: 15px;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-top: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

label {
  display: block;
  margin-top: 10px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 9px;
  background: #087f5b;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.filter {
  background: white;
  color: #087f5b;
  border: 1px solid #087f5b;
  margin-top: 0;
}

.result {
  background: white;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.result h3 {
  margin: 0 0 8px;
}

.map {
  background: #e8f5e9;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
  margin-top: 15px;
  font-size: 18px;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #666;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🚌 WHERE IS MY BUS</h1>
  <p>ODISHA BUS TRACKING</p>
</div>

<div class="container">

  <div class="card">

    <label>📍 From</label>
    <input id="from" type="text" placeholder="Example: Rayagada">

    <label>📍 To</label>
    <input id="to" type="text" placeholder="Example: Lanjigarh">

    <button onclick="searchBus()">🔍 SEARCH BUS</button>

  </div>

  <div class="filters">

    <button class="filter" onclick="showType('Government')">
      🚌 Government
    </button>

    <button class="filter" onclick="showType('Private')">
      🚌 Private
    </button>

    <button class="filter" onclick="showType('School')">
      🎒 School
    </button>

    <button class="filter" onclick="showType('Staff')">
      👨‍💼 Staff
    </button>

  </div>

  <div id="results"></div>

  <div class="map">
    🗺️ LIVE BUS MAP<br>
    <small>Live GPS tracking will be added in the next step.</small>
  </div>

</div>

<div class="footer">
  © 2026 Where Is My Bus Odisha
</div>

<script>

const buses = [

  {
    number: "OD-18-1234",
    route: "Rayagada → Lanjigarh",
    type: "Private",
    status: "🟢 Running"
  },

  {
    number: "OD-18-5678",
    route: "Rayagada → Bhawanipatna",
    type: "Government",
    status: "🟢 Running"
  },

  {
    number: "SCHOOL-001",
    route: "Hundijali → Rayagada",
    type: "School",
    status: "🟡 Not Started"
  },

  {
    number: "STAFF-001",
    route: "Lanjigarh → Rayagada",
    type: "Staff",
    status: "🟢 Running"
  }

];

function searchBus() {

  const from = document
    .getElementById("from")
    .value
    .toLowerCase();

  const to = document
    .getElementById("to")
    .value
    .toLowerCase();

  const results = document.getElementById("results");

  const found = buses.filter(bus => {

    const route = bus.route.toLowerCase();

    return route.includes(from) && route.includes(to);

  });

  displayBuses(found);

}

function showType(type) {

  const found = buses.filter(bus => bus.type === type);

  displayBuses(found);

}

function displayBuses(list) {

  const results = document.getElementById("results");

  if (list.length === 0) {

    results.innerHTML = `
      <div class="result">
        ❌ No bus found
      </div>
    `;

    return;
  }

  results.innerHTML = list.map(bus => `

    <div class="result">

      <h3>🚌 ${bus.number}</h3>

      <p>
        <b>Route:</b> ${bus.route}
      </p>

      <p>
        <b>Type:</b> ${bus.type}
      </p>

      <p>
        <b>Status:</b> ${bus.status}
      </p>

      <button onclick="alert('Live location will be connected here.')">
        📍 LIVE LOCATION
      </button>

    </div>

  `).join("");

}

</script>

</body>
</html>
