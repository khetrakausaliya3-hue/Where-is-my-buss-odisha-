<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Is My Bus Odisha</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7f6;
}
header{
  background:#087f3e;
  color:white;
  padding:20px;
  text-align:center;
}
.container{
  padding:20px;
  max-width:600px;
  margin:auto;
}
input,select,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
button{
  background:#087f3e;
  color:white;
  border:0;
  font-size:16px;
  font-weight:bold;
}
.bus{
  background:white;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #ccc;
}
.live{
  color:green;
  font-weight:bold;
}
#status{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🚍 Where Is My Bus Odisha</h1>
  <p>Government • Private • School • Staff Bus</p>
</header>

<div class="container">

  <h2>Search Bus</h2>

  <input id="from" placeholder="From: Example Rayagada">

  <input id="to" placeholder="To: Example Lanjigarh">

  <select id="type">
    <option value="All">All Bus</option>
    <option value="Government">Government</option>
    <option value="Private">Private</option>
    <option value="School">School</option>
    <option value="Staff">Staff</option>
  </select>

  <button onclick="searchBus()">🔎 SEARCH BUS</button>

  <div id="results"></div>

  <div id="status"></div>

</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* ==============================
   FIREBASE CONFIG
   ============================== */

const firebaseConfig = {

  apiKey: "PASTE_YOUR_API_KEY_HERE",

  authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",

  databaseURL: "PASTE_YOUR_DATABASE_URL_HERE",

  projectId: "where-is-my-buss-odisha",

  storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",

  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",

  appId: "PASTE_YOUR_APP_ID_HERE"

};


/* Firebase start */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* Bus data */

let buses = {};

const busesRef = ref(db, "buses");

onValue(busesRef, (snapshot) => {

  buses = snapshot.val() || {};

  document.getElementById("status").innerHTML =
    "🔥 Firebase connected • Bus data ready";

});


/* Search Bus */

window.searchBus = function(){

  const from =
    document.getElementById("from").value.toLowerCase();

  const to =
    document.getElementById("to").value.toLowerCase();

  const type =
    document.getElementById("type").value;

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  let found = false;

  Object.values(buses).forEach(bus => {

    const route =
      ((bus.from || "") + " " + (bus.to || "")).toLowerCase();

    const typeMatch =
      type === "All" || bus.type === type;

    const fromMatch =
      !from || route.includes(from);

    const toMatch =
      !to || route.includes(to);

    if(fromMatch && toMatch && typeMatch){

      found = true;

      results.innerHTML += `

        <div class="bus">

          <h3>🚍 ${bus.number || "Bus"}</h3>

          <p>
            <b>Route:</b>
            ${bus.from || "-"} → ${bus.to || "-"}
          </p>

          <p>
            <b>Type:</b>
            ${bus.type || "-"}
          </p>

          <p class="live">
            📍 ${bus.status || "Location unavailable"}
          </p>

        </div>

      `;

    }

  });

  if(!found){

    results.innerHTML =
      "<p>❌ No bus found. Try another search.</p>"


  





</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0CneoQrvruVu3a02A05oR_4whslAtFPQ",
  authDomain: "where-is-my-buss-odisha.firebaseapp.com",
  databaseURL: "https://where-is-my-buss-odisha-default-rtdb.firebaseio.com",
  projectId: "where-is-my-buss-odisha",
  storageBucket: "where-is-my-buss-odisha.firebasestorage.app",
  messagingSenderId: "531545613411",
  appId: "1:531545613411:web:3d755ee06999fd23108456"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const busRef = db.ref("STAFF-001");

busRef.on("value", (snapshot) => {
  const bus = snapshot.val();

  if (bus) {
    console.log("Bus data:", bus);
    console.log("Latitude:", bus.Latitude);
    console.log("Longitude:", bus.Longitude);
  }
});
</script>
</body>
</html>
