
<!DOCTYPE\u003C!> html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Where Is My Bus Odisha</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f7f6;
}

header {
  background: #087f3e;
  color: white;
  padding: 22px 12px;
  text-align: center;
}

header h1 {
  font-size: 25px;
  margin: 0;
}

.container {
  padding: 15px;
  max-width: 650px;
  margin: auto;
}

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  font-size: 16px;
}

button {
  background: #087f3e;
  color: white;
  border: none;
  font-weight: bold;
}

#status, #gpsStatus, #liveSaveStatus {
  padding: 10px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.bus {
  background: white;
  padding: 18px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #ccc;
}

.live {
  color: green;
  font-weight: bold;
}

.noBus {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
}

#map {
  width: 100%;
  height: 400px;
  margin-top: 20px;in-top: 20px;
  border-radius: 12px;
}
</style>
</head>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<body>

<header>
<h1>🚍 Where Is My Bus Odisha</h1>
<p>Government • Private • School • Staff Bus</p>
</header>

<div class="container">

<h2>🔎 Search Bus</h2>

<input id="busNumber"
placeholder="Bus Number: Example STAFF-001">

<input id="from"
placeholder="From: Example Lanjigarh">

<input id="to"
placeholder="To: Example Rayagada">

<select id="type">
<option value="All">All Bus</option>
<option value="Government">Government</option>
<option value="Private">Private</option>
<option value="School">School</option>
<option value="Staff">Staff</option>
</select>

<button onclick="searchBus()">🔎 SEARCH BUS</button>

<div id="status">⏳ Connecting to Firebase...</div>

<div id="results"></div>

<div id="map"></div>

<hr>

<h2>📍 Driver GPS</h2>

<button onclick="testMyGPS()">Test My Phone GPS</button>

<p id="gpsStatus">GPS not tested yet</p>

<button onclick="saveLiveGPS()">Save Live GPS</button>

<p id="liveSaveStatus">Live GPS not saved yet</p>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* FIREBASE DATABASE */

const firebaseConfig = {
  apiKey: "AIzaSyC0CneoQrvruVu3a02A05oR_4whslAtFPQ",
  authDomain: "where-is-my-buss-odisha.firebaseapp.com",
  databaseURL: "https://where-is-my-buss-odisha-default-rtdb.firebaseio.com",
  projectId: "where-is-my-buss-odisha",
  storageBucket: "where-is-my-buss-odisha.firebasestorage.app",
  messagingSenderId: "531545613411",
  appId: "1:531545613411:web:3d755ee06999fd23108456",
  measurementId: "G-X7495P9PX3"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

const firebaseURL =
"https://where-is-my-buss-odisha-default-rtdb.firebaseio.com";

let allBuses = [];
let markers = [];

let map = L.map("map").setView(
[19.9167, 83.4167], 7
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution: "&copy; OpenStreetMap contributors"
}
).addTo(map);


/* GET DATABASE VALUE */

function getBusValue(bus, field, fallback = "") {

  const wanted = field.toLowerCase();

  const key = Object.keys(bus || {}).find(
    k => k.toLowerCase() === wanted
  );

  return key !== undefined ? bus[key] : fallback;
}


/* SAFE TEXT */

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}


/* LOAD FIREBASE DATA */

async function loadBuses() {

  const status = document.getElementById("status");

  status.innerHTML = "⏳ Loading buses...";

  try {

    const response = await fetch(firebaseURL + "/.json");

    if (!response.ok) {
      throw new Error("Firebase data load failed: " + response.status);
    }

    const data = await response.json();

    allBuses = [];

    if (!data || typeof data !== "object") {

      status.innerHTML = "❌ No bus data found";

      showBuses([]);

      return;
    }

    Object.keys(data).forEach(busId => {

      const bus = data[busId];

      if (bus && typeof bus === "object" && !Array.isArray(bus)) {

        const busNumber = getBusValue(bus, "busNumber", busId);

        const from = getBusValue(bus, "From", "");
        const to = getBusValue(bus, "to", "");
        const type = getBusValue(bus, "Type", "");

        allBuses.push({
          ...bus,
          databaseId: busId,
          busNumber: busNumber,
          From: from,
          to: to,
          Type: type
        });

      }

    });

    status.innerHTML =
      "🔥 Firebase connected • " +
      allBuses.length + " bus ready";

    showBuses(allBuses);

  } catch (error) {

    console.error("Firebase Error:", error);

    status.innerHTML =
      "❌ Firebase error: " + safeText(error.message);

  }

}


/* SHOW BUSES */

function showBuses(buses) {

  const results = document.getElementById("results");

  results.innerHTML = "";

  markers.forEach(marker => map.removeLayer(marker));

  markers = [];

  if (!buses.length) {

    results.innerHTML = `
      <div class="noBus">
        ❌ No bus found.
        <br><br>
        Try another Bus Number, From, To or Bus Type.
      </div>
    `;

    return;
  }

  buses.forEach(bus => {

    const busNumber = getBusValue(bus, "busNumber", bus.databaseId);
    const from = getBusValue(bus, "From", "-");
    const to = getBusValue(bus, "to", "-");
    const type = getBusValue(bus, "Type", "Unknown");

    const latitude = Number(getBusValue(bus, "Latitude", NaN));
    const longitude = Number(getBusValue(bus, "Longitude", NaN));

    const validGPS =
      Number.isFinite(latitude) &&
      Number.isFinite(longitude) &&
      latitude >= -90 && latitude <= 90 &&
      longitude >= -180 && longitude <= 180;

    results.innerHTML += `

      <div class="bus">

        <h2>🚍 ${safeText(busNumber)}</h2>

        <p><b>Route:</b>
        ${safeText(from)} → ${safeText(to)}</p>

        <p><b>Type:</b> ${safeText(type)}</p>

        <p class="live">📍 LIVE LOCATION</p>

        <p><b>Latitude:</b>
        ${validGPS ? latitude : "-"}</p>

        <p><b>Longitude:</b>
        ${validGPS ? longitude : "-"}</p>

      </div>
    `;

    if (validGPS) {

      const marker = L.marker([
        latitude,
        longitude
      ]).addTo(map);

      marker.bindPopup(`
        🚍 <b>${safeText(busNumber)}</b>
        <br>${safeText(from)} → ${safeText(to)}
        <br>Type: ${safeText(type)}
      `);

      markers.push(marker);

    }

  });

  if (markers.length > 0) {

    map.fitBounds(
      L.featureGroup(markers).getBounds(),
      { padding: [20, 20] }
    );

  }

}


/* SEARCH BUS */

function searchBus() {

  const number = document.getElementById("busNumber")
    .value.toLowerCase().trim();

  const from = document.getElementById("from")
    .value.toLowerCase().trim();

  const to = document.getElementById("to")
    .value.toLowerCase().trim();

  const type = document.getElementById("type")
    .value.toLowerCase();

  const filtered = allBuses.filter(bus => {

    const busNumber = String(bus.busNumber || "")
      .toLowerCase();

    const busFrom = String(bus.From || "")
      .toLowerCase();

    const busTo = String(bus.to || "")
      .toLowerCase();

    const busType = String(bus.Type || "")
      .toLowerCase();

    return (
      busNumber.includes(number) &&
      busFrom.includes(from) &&
      busTo.includes(to) &&
      (type === "all" || busType === type)
    );

  });

  showBuses(filtered);

  document.getElementById("status").innerHTML =
    filtered.length + " bus found";

}


/* TEST PHONE GPS */

function testMyGPS() {

  const status = document.getElementById("gpsStatus");

  if (!navigator.geolocation) {

    status.innerHTML = "❌ GPS not supported";

    return;
  }

  status.innerHTML = "📍 Checking GPS...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      status.innerHTML =
        "Latitude: " + lat.toFixed(6) +
        "<br>Longitude: " + lon.toFixed(6);

      alert("GPS working successfully!");

    },

    function(error) {

      status.innerHTML = "GPS Error: " + safeText(error.message);

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }

  );

}


/* SAVE LIVE GPS */

async function saveLiveGPS() {

  const status = document.getElementById("liveSaveStatus");

  const busNumber = document.getElementById("busNumber")
    .value.trim().toUpperCase();

  if (!busNumber) {

    alert("Please enter Bus Number first.");

    return;
  }

  if (!navigator.geolocation) {

    alert("GPS is not supported.");

    return;
  }

  status.innerHTML = "📍 Getting GPS location...";

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      try {

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        const busURL =
          firebaseURL + "/" +
          encodeURIComponent(busNumber) + ".json";

        const check = await fetch(busURL);

        if (!check.ok) {
          throw new Error("Firebase read failed");
        }

        const busData = await check.json();

        if (!busData || typeof busData !== "object") {
          throw new Error("Bus Number not found in Firebase");
        }

        const response = await fetch(busURL, {

          method: "PATCH",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            Latitude: lat,
            Longitude: lon,
            updatedAt: new Date().toISOString()

          })

        });

        if (!response.ok) {
          throw new Error("Firebase save failed");
        }

        status.innerHTML =
          "✅ GPS saved for " + safeText(busNumber);

        alert("GPS saved successfully!");

        await loadBuses();

      } catch (error) {

        status.innerHTML =
          "❌ Save error: " + safeText(error.message);

        alert(error.message);

      }

    },

    function(error) {

      status.innerHTML =
        "❌ GPS error: " + safeText(error.message);

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }

  );

}


/* START APP */

loadBuses();

</script>

</body>
</html>
