<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Where Is My Bus Odisha</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7f6;
}

header{
  background:#087f3e;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  font-size:17px;
}

.container{
  padding:20px;
  max-width:650px;
  margin:auto;
}

input,select,button{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
  font-size:16px;
}

button{
  background:#087f3e;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

.bus{
  background:white;
  padding:20px;
  margin-top:18px;
  border-radius:15px;
  box-shadow:0 2px 10px #ccc;
}

.bus h2{
  margin-top:0;
}

.live{
  color:green;
  font-weight:bold;
  font-size:18px;
}

#status{
  margin-top:18px;
  padding:10px;
  font-weight:bold;
}

#map{
  width:100%;
  height:400px;
  margin-top:20px;
  border-radius:15px;
  overflow:hidden;
}

.noBus{
  background:white;
  padding:20px;
  margin-top:18px;
  border-radius:15px;
  box-shadow:0 2px 10px #ccc;
  font-size:18px;
}

</style>

</head>

<body>

<header>

<h1>🚍 Where Is My Bus Odisha</h1>

<p>
Government • Private • School • Staff Bus
</p>

</header>

<div class="container">

<h2>🔎 Search Bus</h2>

<input
id="busNumber"
placeholder="Bus Number: Example STAFF-001">

<input
id="from"
placeholder="From: Example Lanjigarh">

<input
id="to"
placeholder="To: Example Rayagada">

<select id="type">

<option value="All">All Bus</option>

<option value="Government">
Government
</option>

<option value="Private">
Private
</option>

<option value="School">
School
</option>

<option value="Staff">
Staff
</option>

</select>

<button onclick="searchBus()">
🔎 SEARCH BUS
</button>

<div id="results"></div>

<div id="status">
⏳ Connecting to Firebase...
</div>

<div id="map"></div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyC0CneoQrvruVu3a02A05oR_4whslAtFPQ",

authDomain:
"where-is-my-buss-odisha.firebaseapp.com",

databaseURL:
"https://where-is-my-buss-odisha-default-rtdb.firebaseio.com",

projectId:
"where-is-my-buss-odisha",

storageBucket:
"where-is-my-buss-odisha.firebasestorage.app",

messagingSenderId:
"531545613411",

appId:
"1:531545613411:web:3d755ee06999fd23108456"

};


/* =========================
   FIREBASE START
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);


/* =========================
   MAP
========================= */

const map =
L.map("map").setView(
[19.9167,83.4167],
10
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:
"&copy; OpenStreetMap contributors"
}
).addTo(map);


/* =========================
   VARIABLES
========================= */

let allBuses = [];

let markers = [];


/* =========================
   READ ALL BUS DATA
========================= */

const busesRef =
ref(db);

onValue(busesRef,(snapshot)=>{

const data =
snapshot.val();

allBuses = [];

if(!data){

document.getElementById("status").innerHTML =
"❌ No bus data found";

return;

}


/* READ EACH BUS */

Object.keys(data).forEach((busId)=>{

const bus =
data[busId];

if(
bus &&
typeof bus === "object" &&
(
bus.busNumber ||
bus.From ||
bus.to ||
bus.Type
)
){

allBuses.push({

...bus,

databaseId:busId

});

}

});


/* STATUS */

document.getElementById("status").innerHTML =
"🔥 Firebase connected • " +
allBuses.length +
" bus ready";


/* SHOW ALL BUSES */

showBuses(allBuses);

});


/* =========================
   SHOW BUS LIST
========================= */

function showBuses(buses){

const results =
document.getElementById("results");

results.innerHTML = "";


/* CLEAR OLD MARKERS */

markers.forEach(marker=>{
map.removeLayer(marker);
});

markers = [];


if(buses.length === 0){

results.innerHTML =
"<div class='noBus'>" +
"❌ No bus found. Try another search." +
"</div>";

return;

}


/* SHOW EACH BUS */

buses.forEach(bus=>{

const busNumber =
bus.busNumber ||
bus.databaseId ||
"Unknown Bus";

const from =
bus.From ||
"-";

const to =
bus.to ||
"-";

const type =
bus.Type ||
"Unknown";

const latitude =
Number(bus.Latitude);

const longitude =
Number(bus.Longitude);


results.innerHTML += `

<div class="bus">

<h2>
🚍 ${busNumber}
</h2>

<p>
<b>Route:</b>
${from} → ${to}
</p>

<p>
<b>Type:</b>
${type}
</p>

<p class="live">
📍 LIVE LOCATION
</p>

<p>
<b>Latitude:</b>
${!isNaN(latitude) ? latitude : "-"}
</p>

<p>
<b>Longitude:</b>
${!isNaN(longitude) ? longitude : "-"}
</p>

</div>

`;


/* MAP MARKER */

if(
!isNaN(latitude) &&
!isNaN(longitude)
){

const marker =
L.marker(
[latitude,longitude]
).addTo(map);

marker.bindPopup(

"🚍 <b>" +
busNumber +
"</b><br>" +
from +
" → " +
to +
"<br>Type: " +
type

);

markers.push(marker);

}

});

}


/* =========================
   SEARCH BUS
========================= */

window.searchBus =
function(){

const number =
document
.getElementById("busNumber")
.value
.toLowerCase()
.trim();

const from =
document
.getElementById("from")
.value
.toLowerCase()
.trim();

const to =
document
.getElementById("to")
.value
.toLowerCase()
.trim();

const type =
document
.getElementById("type")
.value;


/* FILTER */

const filtered =
allBuses.filter(bus=>{

const busNumber =
(
bus.busNumber ||
bus.databaseId ||
""
)
.toLowerCase()
.trim();

const busFrom =
(
bus.From ||
""
)
.toLowerCase()
.trim();

const busTo =
(
bus.to ||
""
)
.toLowerCase()
.trim();

const busType =
bus.Type ||
"";


const numberMatch =
!number ||
busNumber.includes(number);

const fromMatch =
!from ||
busFrom.includes(from);

const toMatch =
!to ||
busTo.includes(to);

const typeMatch =
type === "All" ||
busType === type;


return
numberMatch &&
fromMatch &&
toMatch &&
typeMatch;

});


/* SHOW RESULT */

showBuses(filtered);


/* MAP VIEW */

if(filtered.length > 0){

const bus =
filtered[0];

const lat =
Number(bus.Latitude);

const lng =
Number(bus.Longitude);

if(
!isNaN(lat) &&
!isNaN(lng)
){

map.setView(
[lat,lng],
13
);

}

}

};

</script>

</body>

</html>
